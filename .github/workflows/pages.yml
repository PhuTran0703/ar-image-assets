# Mỗi lần push: tạo catalog.json (danh sách ảnh + tên từ titles.json) rồi deploy
# images/ lên GitHub Pages.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site + catalog.json
        run: |
          mkdir _site
          cp -R images _site/images
          python3 - <<'PY'
          import json, os
          exts = ('.png', '.jpg', '.jpeg', '.webp', '.gif')
          files = sorted(
              os.path.join(root, name).replace(os.sep, '/')
              for root, _, names in os.walk('images')
              for name in names
              if name.lower().endswith(exts)
          )
          titles = {}
          if os.path.exists('titles.json'):
              with open('titles.json', encoding='utf-8') as f:
                  raw = json.load(f)
              titles = {p: t.strip() for p, t in raw.items()
                        if p in set(files) and isinstance(t, str) and t.strip()}
          with open('_site/catalog.json', 'w', encoding='utf-8') as f:
              json.dump({'version': 1, 'files': files, 'titles': titles}, f,
                        ensure_ascii=False)
          print(f'{len(files)} files, {len(titles)} titles')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
