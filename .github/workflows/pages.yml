# Mỗi lần push: tạo catalog.json (danh sách ảnh + tên từ titles.json + loại mở
# khoá từ access.json + hash nội dung để app nhận ảnh đã sửa + ngày thêm ảnh cho
# mục "New" trên Home + hash bản dịch tên + chủ đề ghim "Topic of the Day" từ
# featured.json + icon huy hiệu chủ đề từ badges/<Tên chủ đề>.png) rồi deploy
# images/ + badges/ + legal/ +
# titles/ (bản dịch tên ảnh từ title_translations/) lên GitHub Pages.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần toàn bộ lịch sử để biết ngày thêm từng ảnh.
          fetch-depth: 0

      - name: Build site + catalog.json
        run: |
          mkdir _site
          cp -R images _site/images
          # Icon huy hiệu chủ đề (tuỳ chọn): badges/<Tên chủ đề>.png.
          if [ -d badges ]; then cp -R badges _site/badges; fi
          # Privacy Policy / Terms of Use (13 ngôn ngữ) cho app và store.
          cp -R legal _site/legal
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          exts = ('.png', '.jpg', '.jpeg', '.webp', '.gif')
          files = sorted(
              os.path.join(root, name).replace(os.sep, '/')
              for root, _, names in os.walk('images')
              for name in names
              if name.lower().endswith(exts)
          )
          # Icon huy hiệu chủ đề (tuỳ chọn): badges/<Tên thư mục chủ đề>.<đuôi>.
          # Chủ đề không có icon → app dùng ảnh đầu tiên của chủ đề.
          topic_names = {p.split('/')[1] for p in files if p.count('/') == 2}
          badges = {}
          if os.path.isdir('badges'):
              for n in sorted(os.listdir('badges')):
                  path = f'badges/{n}'
                  if not (n.lower().endswith(exts) and os.path.isfile(path)):
                      continue
                  topic = os.path.splitext(n)[0]
                  if topic not in topic_names:
                      print(f'badges: bỏ qua {n}, không có chủ đề "{topic}"')
                  else:
                      badges[topic] = path
          print(f'Icon huy hiệu: {len(badges)} chủ đề '
                f'({", ".join(sorted(badges)) or "chưa có"})')
          all_files = set(files)
          titles = {}
          if os.path.exists('titles.json'):
              with open('titles.json', encoding='utf-8') as f:
                  raw = json.load(f)
              titles = {p: t.strip() for p, t in raw.items()
                        if p in all_files and isinstance(t, str) and t.strip()}
          # Loại mở khoá: free / ad (xem quảng cáo) / premium. Ảnh không có ở
          # đây được app tự chia theo vị trí trong chủ đề.
          access = {}
          if os.path.exists('access.json'):
              with open('access.json', encoding='utf-8') as f:
                  raw = json.load(f)
              for p, kind in raw.items():
                  kind = kind.strip().lower() if isinstance(kind, str) else ''
                  if p not in set(files):
                      print(f'access.json: bỏ qua (không có ảnh): {p}')
                  elif kind not in ('free', 'ad', 'premium'):
                      print(f'access.json: bỏ qua (giá trị sai "{kind}"): {p}')
                  else:
                      access[p] = kind
          versions = {}
          for p in files + list(badges.values()):
              with open(p, 'rb') as f:
                  versions[p] = hashlib.sha1(f.read()).hexdigest()[:10]
          # Ngày thêm ảnh (unix giây) từ git: lần "A" gần nhất của path đó.
          # --no-renames: ảnh chuyển chủ đề tính là mới ở chủ đề mới.
          # Bỏ qua đợt nhập ban đầu (commit thêm ảnh đầu tiên) — không phải "mới".
          log = subprocess.run(
              ['git', 'log', '--no-renames', '--diff-filter=A',
               '--name-only', '--format=@@%H %ct', '--', 'images'],
              capture_output=True, text=True, check=True).stdout
          adds, commit, stamp = [], None, None
          for line in log.splitlines():
              if line.startswith('@@'):
                  commit, stamp = line[2:].split()
              elif line.strip():
                  adds.append((line.strip(), commit, int(stamp)))
          baseline = adds[-1][1] if adds else None
          added = {}
          for path, sha, ts in adds:  # mới nhất trước
              if path in added or path not in versions:
                  continue
              added[path] = 0 if sha == baseline else ts
          added = {p: ts for p, ts in added.items() if ts}
          # Bản dịch tên ảnh: title_translations/<code>.json, khoá là tên
          # tiếng Anh (giá trị trong titles.json). Deploy thành titles/<code>.json;
          # catalog.json chỉ ghi hash để app chỉ tải lại khi bản dịch đổi.
          title_i18n = {}
          os.makedirs('_site/titles', exist_ok=True)
          english = set(titles.values())
          if os.path.isdir('title_translations'):
              for name in sorted(os.listdir('title_translations')):
                  if not name.endswith('.json'):
                      continue
                  code = name[:-5]
                  with open(os.path.join('title_translations', name),
                            encoding='utf-8') as f:
                      raw = json.load(f)
                  tr = {k: v.strip() for k, v in raw.items()
                        if isinstance(k, str) and isinstance(v, str)
                        and v.strip()}
                  body = json.dumps(tr, ensure_ascii=False, sort_keys=True)
                  with open(f'_site/titles/{code}.json', 'w',
                            encoding='utf-8') as f:
                      f.write(body)
                  title_i18n[code] = hashlib.sha1(
                      body.encode('utf-8')).hexdigest()[:10]
                  missing = sorted(english - set(tr))
                  print(f'title_translations/{name}: {len(tr)} tên, '
                        f'thiếu {len(missing)}')
                  for t in missing[:20]:
                      print(f'  thiếu bản dịch: {t}')
          # Chủ đề ghim cho "Topic of the Day" (featured.json). Trống / sai tên
          # thư mục → không ghim, app tự random mỗi ngày.
          featured = ''
          if os.path.exists('featured.json'):
              with open('featured.json', encoding='utf-8') as f:
                  raw = json.load(f).get('topic', '')
              raw = raw.strip() if isinstance(raw, str) else ''
              topics = {p.split('/')[1] for p in files if p.count('/') == 2}
              topics.discard('Banner-Settings')
              if raw and raw not in topics:
                  print(f'featured.json: bỏ qua, không có chủ đề "{raw}". '
                        f'Chủ đề hợp lệ: {", ".join(sorted(topics))}')
              elif raw:
                  featured = raw
          print(f'Topic of the Day: {featured or "random"}')
          catalog = {'version': 1, 'files': files, 'titles': titles,
                     'access': access, 'versions': versions,
                     'added': added, 'title_i18n': title_i18n}
          if featured:
              catalog['featured'] = featured
          if badges:
              catalog['badges'] = badges
          with open('_site/catalog.json', 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False)
          print(f'{len(files)} files, {len(titles)} titles, '
                f'{len(access)} access, {len(added)} new, '
                f'{len(title_i18n)} title languages, '
                f'{len(badges)} badge icons')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
